<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goorm TV</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header id="header">
      <div id="header-title">Goorm TV</div>
      <nav id="nav">
        <div id="view-tabs" class="tabs">
          <button id="tab-popular" class="tab active">인기</button>
          <button id="tab-bookmark" class="tab">북마크</button>
        </div>
        <section id="search">
          <input type="text" id="search-input" placeholder="Search Movie" />
          <button id="search-btn">검색</button>
        </section>
      </nav>
    </header>
    <main>
      <section id="card-list"></section>
      <p id="message"></p>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
