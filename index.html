<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goorm TV</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header id="header">
      <div id="header-title">Goorm TV</div>
      <nav id="nav">
        <div id="tabs" class="tabs">
          <button id="popular" class="tab active">인기</button>
          <button id="bookmark" class="tab">북마크</button>
        </div>
        <section id="search">
          <input type="text" id="search-input" placeholder="Search Movie" />
          <button id="search-btn">검색</button>
        </section>
      </nav>
    </header>

    <!-- Main -->
    <main>
      <section id="card-list"></section>
      <p id="message"></p>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title"></h2>
          <button id="modal-close">닫기</button>
        </div>
        <div class="modal-body">
          <img id="modal-poster" alt="" />
          <div>
            <div id="modal-meta"></div>
            <div id="modal-description"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
