<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goorm TV</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    Header
    <header id="header">
      <h1 id="header-title">Goorm TV</h1>
      <section id="search">
        <input type="text" />
        <button id="search-btn">검색</button>
      </section>
    </header>
    <main>
      <div id="bookmark">
        <button id="bookmark-btn">북마크</button>
      </div>
      <section id="card-list">
        <div class="card">
          <div class="card-score"></div>
          <div class="card-img"></div>
          <div class="card-title"></div>
          <div class="card-discription"></div>
        </div>
      </section>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
